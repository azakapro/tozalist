name: tozalist-step91-verify

services:
  caddy:
    volumes:
      - ./deploy/Caddyfile.verify:/etc/caddy/Caddyfile:ro

  api:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      DASHBOARD_ORIGIN: http://127.0.0.1/dashboard
      WEB_ORIGIN: http://127.0.0.1
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  dashboard:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1/api
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1/api

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1/api
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1/api

  postgres-backup:
    environment:
      BACKUP_S3_ENDPOINT: http://minio:9000
      BACKUP_ALLOW_INSECURE_LOCAL: 'true'
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    expose: ['9000']
    networks: [backend]

  minio-init:
    image: tozalist-postgres-backup:${IMAGE_TAG:-local}
    restart: 'no'
    entrypoint: ['/bin/bash', '-c']
    command:
      - >-
        if ! aws --endpoint-url http://minio:9000 --region "$${BACKUP_S3_REGION}"
        s3api head-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1; then
        aws --endpoint-url http://minio:9000 --region "$${BACKUP_S3_REGION}"
        s3api create-bucket --bucket "$${S3_BUCKET}" >/dev/null; fi;
        aws --endpoint-url http://minio:9000 --region "$${BACKUP_S3_REGION}"
        s3api head-bucket --bucket "$${S3_BUCKET}";
        if ! aws --endpoint-url http://minio:9000 --region "$${BACKUP_S3_REGION}"
        s3api head-bucket --bucket "$${BACKUP_S3_BUCKET}" >/dev/null 2>&1; then
        aws --endpoint-url http://minio:9000 --region "$${BACKUP_S3_REGION}"
        s3api create-bucket --bucket "$${BACKUP_S3_BUCKET}" >/dev/null; fi;
        aws --endpoint-url http://minio:9000 --region "$${BACKUP_S3_REGION}"
        s3api head-bucket --bucket "$${BACKUP_S3_BUCKET}"
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:?BACKUP_S3_REGION is required}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      AWS_EC2_METADATA_DISABLED: 'true'
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]

volumes:
  minio_data:

networks:
  edge:
    name: tozalist-step91-verify-edge
  backend:
    name: tozalist-step91-verify-backend
